def find_max(numbers):
    """
    Find and return the maximum number from a list of numbers.

    Parameters:
    numbers (list): A list of numerical values.

    Returns:
    float or None: The maximum number in the list or None if the list is empty.
    """
    
    # Check if the input list is empty
    if not numbers:
        return None  # Return None to indicate that there is no maximum in an empty list

    # Initialize max_num with the first element of the list
    max_num = numbers[0]

    # Iterate through each number in the list
    for num in numbers:
        # Update max_num if the current number is greater
        if num > max_num:
            max_num = num

    return max_num  # Return the maximum number found

# Example usage:
if __name__ == "__main__":
    # Test cases to validate the function
    print(find_max([3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5]))  # Should return 9
    print(find_max([-7, -1, -5, -3]))                   # Should return -1
    print(find_max([]))                                  # Should return None